name: Verify and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install compiler
        run: python -m pip install ziglang==0.17.1
      - name: Build and run native tests
        shell: pwsh
        run: ./build.ps1
      - name: Check embedded module matches source
        run: git diff --exit-code -- js/avl-wasm.js
      - name: Test WebAssembly bridge
        run: node test/test_wasm.cjs
      - name: Prepare website
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force _site | Out-Null
          Copy-Item index.html, LICENSE, THIRD_PARTY_NOTICES.md -Destination _site
          Copy-Item css, js, assets, src -Destination _site -Recurse
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
